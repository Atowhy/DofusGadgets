<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur d'URL DofusDB pour Almanax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        textarea { white-space: pre; overflow-wrap: normal; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl mx-auto bg-gray-800 rounded-2xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-teal-400 mb-2">Générateur d'URL pour le JSON de l'Almanax</h1>
        <p class="text-gray-400 mb-6">Cet outil va charger votre fichier <code class="bg-gray-700 px-1 rounded">almanax_offerings.json</code>, trouver l'URL DofusDB pour chaque ressource, et générer le nouveau JSON complet.</p>

        <div class="mb-6">
            <button id="startButton" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md disabled:opacity-50 disabled:cursor-wait">
                Démarrer la génération
            </button>
        </div>

        <div id="progressContainer" class="hidden w-full bg-gray-700 rounded-full h-2.5 mb-6">
            <div id="progressBar" class="bg-teal-500 h-2.5 rounded-full" style="width: 0%"></div>
        </div>
        <p id="progressText" class="text-center text-gray-400 mb-4"></p>

        <div>
            <label for="output" class="block text-sm font-medium text-gray-300 mb-2">Résultat (copier-coller dans votre fichier) :</label>
            <textarea id="output" rows="15" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition" readonly></textarea>
        </div>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const outputTextarea = document.getElementById('output');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        // Fonction pour ajouter un délai entre les appels API pour ne pas surcharger le serveur de DofusDB
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        startButton.addEventListener('click', async () => {
            startButton.disabled = true;
            startButton.textContent = 'Génération en cours...';
            progressContainer.classList.remove('hidden');
            outputTextarea.value = '';
            
            try {
                // 1. Charger le fichier JSON local
                const response = await fetch('almanax_offerings.json');
                if (!response.ok) {
                    throw new Error("Impossible de charger le fichier almanax_offerings.json. Assurez-vous qu'il est dans le même dossier que cet outil.");
                }
                const almanaxData = await response.json();
                const totalItems = almanaxData.length;

                const updatedAlmanaxData = [];
                const itemUrlCache = {};

                // 2. Itérer sur chaque offrande
                for (let i = 0; i < totalItems; i++) {
                    const entry = almanaxData[i];
                    const resourceName = entry.resource;
                    let dofusDbUrl = '#';

                    // Mettre à jour la barre de progression
                    const percentComplete = ((i + 1) / totalItems) * 100;
                    progressBar.style.width = `${percentComplete}%`;
                    progressText.textContent = `Traitement de : ${resourceName} (${i + 1} / ${totalItems})`;

                    // Vérifier le cache d'abord
                    if (itemUrlCache[resourceName]) {
                        dofusDbUrl = itemUrlCache[resourceName];
                    } else {
                        // Sinon, appeler l'API
                        try {
                            const searchName = encodeURIComponent(resourceName);
                            const apiResponse = await fetch(`https://api.dofusdb.fr/items?name.fr=${searchName}&lang=fr`);
                            if (apiResponse.ok) {
                                const data = await apiResponse.json();
                                const item = data.data && data.data.length > 0 ? data.data[0] : null;
                                if (item && item.id) {
                                    dofusDbUrl = `https://dofusdb.fr/fr/database/object/${item.id}`;
                                }
                            }
                        } catch (apiError) {
                            console.error(`Erreur API pour ${resourceName}:`, apiError);
                        }
                        // Mettre en cache le résultat (même en cas d'échec)
                        itemUrlCache[resourceName] = dofusDbUrl;
                        await sleep(50); // Petit délai pour être respectueux de l'API
                    }

                    // 3. Ajouter la nouvelle clé au nouvel objet
                    updatedAlmanaxData.push({
                        ...entry,
                        dofusdb_url: dofusDbUrl
                    });
                }

                // 4. Afficher le JSON final
                outputTextarea.value = JSON.stringify(updatedAlmanaxData, null, 4);
                progressText.textContent = 'Terminé ! Vous pouvez copier le résultat.';
                startButton.textContent = 'Génération terminée';

            } catch (error) {
                progressText.textContent = `Erreur : ${error.message}`;
                console.error(error);
                startButton.disabled = false;
                startButton.textContent = 'Réessayer';
            }
        });
    </script>

</body>
</html>
